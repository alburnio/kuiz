<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tadika Ceria - Belajar Sambil Bermain</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Fredoka', cursive, sans-serif;
    background: linear-gradient(135deg, #fef08a 0%, #bae6fd 50%, #fbcfe8 100%);
    min-height: 100vh;
    touch-action: manipulation;
  }
  .bouncy-card {
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
  }
  .bouncy-card:active {
    transform: scale(0.92);
  }
  @keyframes bounceSlow {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .animate-bounce-slow {
    animation: bounceSlow 2s ease-in-out infinite;
  }
</style>
</head>
<body class="p-4 select-none">

<div class="max-w-md mx-auto text-center py-4">
  <div class="inline-block bg-white/80 backdrop-blur px-6 py-2 rounded-full shadow-md mb-2 border-2 border-yellow-300">
    <span class="text-2xl">🌟</span> <span class="font-bold text-xl text-pink-600">Tadika Ceria 3 Tahun</span> <span class="text-2xl">🎨</span>
  </div>
  <p class="text-gray-700 font-semibold text-sm">Tekan gambar untuk belajar dan dengar bunyi!</p>
</div>

<div class="max-w-md mx-auto grid grid-cols-4 gap-2 mb-6">
  <button onclick="switchTab('abc')" id="btn-abc" class="tab-btn bg-pink-500 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-pink-700 flex flex-col items-center justify-center text-sm transition transform active:scale-95">
    <span class="text-2xl">ABC</span>
    <span class="text-xs opacity-90">Huruf</span>
  </button>
  <button onclick="switchTab('123')" id="btn-123" class="tab-btn bg-amber-500 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-amber-700 flex flex-col items-center justify-center text-sm transition transform active:scale-95">
    <span class="text-2xl">123</span>
    <span class="text-xs opacity-90">Nombor</span>
  </button>
  <button onclick="switchTab('warna')" id="btn-warna" class="tab-btn bg-emerald-500 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-emerald-700 flex flex-col items-center justify-center text-sm transition transform active:scale-95">
    <span class="text-2xl">🎨</span>
    <span class="text-xs opacity-90">Warna</span>
  </button>
  <button onclick="switchTab('haiwan')" id="btn-haiwan" class="tab-btn bg-purple-500 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-purple-700 flex flex-col items-center justify-center text-sm transition transform active:scale-95">
    <span class="text-2xl">🐱</span>
    <span class="text-xs opacity-90">Haiwan</span>
  </button>
</div>

<div class="max-w-md mx-auto bg-white/90 backdrop-blur rounded-3xl p-6 shadow-2xl border-4 border-white min-h-[380px] flex flex-col items-center justify-center relative overflow-hidden">
  
  <!-- Interactive Display Modal/Banner inside card -->
  <div id="displayArea" class="text-center w-full">
    <div id="bigEmoji" class="text-8xl mb-4 animate-bounce-slow">🍎</div>
    <div id="bigTitle" class="text-4xl font-extrabold text-gray-800 mb-1">A</div>
    <div id="bigDesc" class="text-xl font-bold text-pink-500">A untuk Ayam / Epal</div>
  </div>

  <!-- Interactive Grid selection -->
  <div id="gridContainer" class="grid grid-cols-3 gap-3 w-full mt-6">
    <!-- Dynamic buttons injected via JS -->
  </div>
</div>

<script>
  let audioCtx = null;
  function playTone(freq, duration = 0.15, type = 'sine') {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  // Data for sections
  const data = {
    abc: [
      { char: 'A', name: 'Ayam', emoji: '🐔', color: 'bg-red-100 border-red-400 text-red-600', sound: 440 },
      { char: 'B', name: 'Buku', emoji: '📘', color: 'bg-blue-100 border-blue-400 text-blue-600', sound: 493 },
      { char: 'C', name: 'Cili', emoji: '🌶️', color: 'bg-orange-100 border-orange-400 text-orange-600', sound: 523 },
      { char: 'D', name: 'Duri', emoji: '🌵', color: 'bg-green-100 border-green-400 text-green-600', sound: 587 },
      { char: 'E', name: 'Epal', emoji: '🍎', color: 'bg-rose-100 border-rose-400 text-rose-600', sound: 659 },
      { char: 'F', name: 'Feri', emoji: '🚢', color: 'bg-purple-100 border-purple-400 text-purple-600', sound: 698 }
    ],
    123: [
      { char: '1', name: 'Satu Angsa', emoji: '🦢', color: 'bg-amber-100 border-amber-400 text-amber-700', sound: 300 },
      { char: '2', name: 'Dua Itik', emoji: '🦆', color: 'bg-yellow-100 border-yellow-400 text-yellow-700', sound: 350 },
      { char: '3', name: 'Tiga Kucing', emoji: '🐱', color: 'bg-emerald-100 border-emerald-400 text-emerald-700', sound: 400 },
      { char: '4', name: 'Empat Bunga', emoji: '🌸', color: 'bg-pink-100 border-pink-400 text-pink-700', sound: 450 },
      { char: '5', name: 'Lima Bintang', emoji: '⭐', color: 'bg-indigo-100 border-indigo-400 text-indigo-700', sound: 500 },
      { char: '6', name: 'Enam Bola', emoji: '⚽', color: 'bg-cyan-100 border-cyan-400 text-cyan-700', sound: 550 }
    ],
    warna: [
      { char: 'Merah', name: 'Warna Merah', emoji: '🔴', color: 'bg-red-100 border-red-400 text-red-600', sound: 500 },
      { char: 'Biru', name: 'Warna Biru', emoji: '🔵', color: 'bg-blue-100 border-blue-400 text-blue-600', sound: 550 },
      { char: 'Hijau', name: 'Warna Hijau', emoji: '🟢', color: 'bg-emerald-100 border-emerald-400 text-emerald-600', sound: 600 },
      { char: 'Kuning', name: 'Warna Kuning', emoji: '🟡', color: 'bg-yellow-100 border-yellow-500 text-yellow-700', sound: 650 },
      { char: 'Jingga', name: 'Warna Jingga', emoji: '🟠', color: 'bg-orange-100 border-orange-400 text-orange-600', sound: 700 },
      { char: 'Ungu', name: 'Warna Ungu', emoji: '🟣', color: 'bg-purple-100 border-purple-400 text-purple-600', sound: 750 }
    ],
    haiwan: [
      { char: 'Meow', name: 'Kucing', emoji: '🐱', color: 'bg-amber-100 border-amber-400 text-amber-700', sound: 320 },
      { char: 'Moo', name: 'Lembu', emoji: '🐮', color: 'bg-stone-100 border-stone-400 text-stone-700', sound: 280 },
      { char: 'Baa', name: 'Kambing', emoji: '🐑', color: 'bg-sky-100 border-sky-400 text-sky-700', sound: 420 },
      { char: 'Kukrik', name: 'Ayam Jantan', emoji: '🐓', color: 'bg-orange-100 border-orange-400 text-orange-700', sound: 480 },
      { char: 'Quack', name: 'Itik', emoji: '🦆', color: 'bg-yellow-100 border-yellow-400 text-yellow-700', sound: 380 },
      { char: 'Wok', name: 'Katak', emoji: '🐸', color: 'bg-emerald-100 border-emerald-400 text-emerald-700', sound: 340 }
    ]
  };

  let currentTab = 'abc';

  function switchTab(tab) {
    currentTab = tab;
    playTone(600, 0.08, 'triangle');
    
    // Highlight active button
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.remove('ring-4', 'ring-white', 'scale-105');
    });
    document.getElementById('btn-' + tab).classList.add('ring-4', 'ring-white', 'scale-105');

    // Load first item as default display
    let first = data[tab][0];
    updateDisplay(first.emoji, first.char, first.name);
    
    renderGrid();
  }

  function updateDisplay(emoji, title, desc) {
    document.getElementById('bigEmoji').textContent = emoji;
    document.getElementById('bigTitle').textContent = title;
    document.getElementById('bigDesc').textContent = desc;
  }

  function renderGrid() {
    let container = document.getElementById('gridContainer');
    container.innerHTML = '';
    
    data[currentTab].forEach((item) => {
      let btn = document.createElement('button');
      btn.className = `bouncy-card ${item.color} border-2 rounded-2xl p-3 flex flex-col items-center justify-center shadow-md cursor-pointer`;
      btn.innerHTML = `<span class="text-3xl">${item.emoji}</span><span class="font-bold text-sm mt-1">${item.char}</span>`;
      btn.onclick = () => {
        playTone(item.sound, 0.2, 'sine');
        updateDisplay(item.emoji, item.char, item.name);
      };
      container.appendChild(btn);
    });
  }

  // Initialize first view on load
  window.onload = () => {
    switchTab('abc');
  };
</script>

</body>
</html>
